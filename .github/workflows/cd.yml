name: CD

on:
  push:
    branches: [homolog, prod]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Terraform apply (RDS MySQL)
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      TF_ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # OIDC (secret AWS_DEPLOY_ROLE_ARN) ou chave de acesso de um usuário IAM (secrets
      # AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY), para contas em que a organização
      # bloqueia o provider OIDC do IAM. Cadastre só um dos dois.
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-database/${TF_ENV}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Apply
        run: |
          terraform apply -auto-approve \
            -var="environment=${TF_ENV}" \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="state_bucket=${{ vars.TF_STATE_BUCKET }}"
